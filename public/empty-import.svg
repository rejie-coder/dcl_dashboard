    <rect x="240" y="258" width="44" height="10" rx="5" fill="#E5E7EB" stroke="none"/>
    <rect x="88" y="318" width="36" height="10" rx="5" fill="#E5E7EB" stroke="none"/>
    <rect x="160" y="318" width="48" height="10" rx="5" fill="#E5E7EB" stroke="none"/>
    <rect x="240" y="318" width="44" height="10" rx="5" fill="#E5E7EB" stroke="none"/>
    <rect x="88" y="378" width="36" height="10" rx="5" fill="#E5E7EB" stroke="none"/>
