    <rect x="64" y="120" width="240" height="320" rx="20" stroke="#D1D5DB" stroke-width="3"/>
    <rect x="64" y="120" width="240" height="52" rx="20" stroke="#D1D5DB" stroke-width="3"/>
    <line x1="64" y1="172" x2="304" y2="172" stroke="#D1D5DB" stroke-width="3"/>
