    <rect x="460" y="120" width="280" height="320" rx="20" stroke="#D1D5DB" stroke-width="3"/>
    <line x1="492" y1="160" x2="492" y2="408" stroke="#E5E7EB" stroke-width="2.5"/>
    <line x1="492" y1="408" x2="712" y2="408" stroke="#E5E7EB" stroke-width="2.5"/>
    <!-- UCL / LCL -->
    <line x1="492" y1="216" x2="712" y2="216" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 8"/>
    <line x1="492" y1="352" x2="712" y2="352" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 8"/>
    <!-- CL -->
    <line x1="492" y1="284" x2="712" y2="284" stroke="#64748B" stroke-width="3"/>
    <!-- measured series -->
    <path d="M500 292 L532 268 L564 300 L596 252 L628 288 L660 200 L692 236"
